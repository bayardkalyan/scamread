<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>ScamRead Admin</title>
  <meta name="theme-color" content="#06090C">
  <link rel="preload" href="/static/fonts/inter-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ static('css/app.css') }}">
  <link rel="stylesheet" href="{{ static('css/admin.css') }}">
  <link rel="icon" href="{{ static('img/favicon.ico') }}" sizes="any">
  <script defer src="{{ static('js/admin.js') }}"></script>
</head>

<body class="admin">
  <header class="site-header">
    <div class="wrap site-header-inner">
      <a class="brand" href="/admin" aria-label="ScamRead admin home">
        <picture>
          <source srcset="{{ static('img/scamread-logo.webp') }}" type="image/webp">
          <img src="{{ static('img/scamread-logo.png') }}" alt="ScamRead" width="180" height="26">
        </picture>
        <span class="brand-tagline">Admin panel</span>
      </a>
      <div id="who" class="who" hidden>
        <span class="who-name"><span class="dot" aria-hidden="true"></span><span id="who-name"></span></span>
        <a class="who-link" href="/" target="_blank" rel="noopener">Open checker</a>
        <button id="logout" class="btn btn-ghost btn-sm" type="button">Log out</button>
      </div>
    </div>
  </header>

  <main class="wrap admin-main">
    <p id="boot" class="muted">Loading…</p>

    <!-- Login -->
    <section id="login-view" class="login" hidden>
      <div class="panel login-card">
        <p class="label">ScamRead admin</p>
        <h1>Log in</h1>
        <form id="login-form" novalidate>
          <label class="field-label" for="login-user">Username</label>
          <input id="login-user" class="input" name="username" autocomplete="username" autocapitalize="characters" spellcheck="false" required>
          <label class="field-label" for="login-pass">Password</label>
          <div class="pass-wrap">
            <input id="login-pass" class="input" name="password" type="password" autocomplete="current-password" required>
            <button type="button" class="pass-toggle" data-for="login-pass" aria-label="Show password">Show</button>
          </div>
          <p id="login-error" class="form-error" role="alert" hidden></p>
          <button class="btn btn-primary btn-block" type="submit">Log in</button>
        </form>
        <p class="muted small">This page is only for ScamRead staff. Repeated wrong passwords lock the login for 15 minutes.</p>
      </div>
    </section>

    <!-- Panel -->
    <section id="app-view" hidden>
      <nav class="tabs" aria-label="Admin sections">
        <button class="tab-btn" data-tab="dashboard" aria-current="page">Dashboard</button>
        <button class="tab-btn" data-tab="brands">Brands</button>
        <button class="tab-btn" data-tab="signs">Warning signs</button>
        <button class="tab-btn" data-tab="campaigns">Campaigns</button>
        <button class="tab-btn" data-tab="account">Account</button>
      </nav>
      <p id="toast" class="toast" role="status" hidden></p>
      <div id="view" class="view"></div>
    </section>
  </main>
</body>
</html>
