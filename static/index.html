<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ScamRead</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="intro" aria-labelledby="title">
        <p class="eyebrow">Scam risk analysis</p>
        <h1 id="title">ScamRead</h1>
        <p class="summary">Paste a suspicious text, email, DM, or link to check for scam signals.</p>
      </section>

      <section class="tool" aria-label="Scam analyzer">
        <label for="message">Message or link</label>
        <textarea
          id="message"
          rows="9"
          maxlength="8000"
          placeholder="Paste the suspicious message or URL here..."
        ></textarea>
        <div class="actions">
          <span id="charCount">0 / 8000</span>
          <button id="analyzeButton" type="button">Analyze</button>
        </div>
      </section>

      <section id="status" class="status" role="status" aria-live="polite"></section>

      <section id="results" class="results hidden" aria-label="Analysis results">
        <div class="score-row">
          <div>
            <p class="label">Risk score</p>
            <p id="riskScore" class="score">0</p>
          </div>
          <div>
            <p class="label">Risk level</p>
            <p id="riskLevel" class="badge">Low</p>
          </div>
          <div>
            <p class="label">Scam type</p>
            <p id="scamType" class="value">Unknown</p>
          </div>
        </div>

        <div class="result-block">
          <h2>Red flags</h2>
          <ul id="redFlags"></ul>
        </div>

        <div class="result-block">
          <h2>Explanation</h2>
          <p id="explanation"></p>
        </div>

        <div class="result-block">
          <h2>Recommended action</h2>
          <p id="recommendedAction"></p>
        </div>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
