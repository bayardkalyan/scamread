# Add inside the existing  server { listen 443 ssl; server_name app.scamread.com; ... }  block.
# (Certbot manages the ssl_* lines; leave them as they are.)

    # Serve CSS, JS, fonts and images straight from disk, cached for a year.
    # File URLs carry ?v=<version>, so a new release is picked up immediately.
    location /static/ {
        alias /opt/scamread/static/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64k;
    }

# And at the http level (e.g. /etc/nginx/conf.d/scamread-gzip.conf):
#   gzip on;
#   gzip_comp_level 5;
#   gzip_min_length 512;
#   gzip_vary on;
#   gzip_proxied any;
#   gzip_types text/css application/javascript application/json image/svg+xml text/plain;
#
# HTTP/2: on nginx >= 1.25.1 add the line  http2 on;  inside the server block.
